# DocNet MVP — Nginx site config
# Copy to /etc/nginx/sites-available/docnet and symlink to sites-enabled.
# Replace YOUR_ELASTIC_IP (or your domain when HTTPS is added).

server {
    listen 80;
    server_name YOUR_ELASTIC_IP;

    root /home/ubuntu/DocNetMVP/client/dist;
    index index.html;
    client_max_body_size 5M;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
